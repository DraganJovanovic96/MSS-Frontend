<div class="lightbox-container" (keydown)="onKeyDown($event)" tabindex="0">
  <button class="close-button" (click)="close()" title="Close">✕</button>

  <button
    class="nav-button previous"
    (click)="previousPhoto()"
    [disabled]="totalPhotos <= 1"
    title="Previous photo"
  >
    ‹
  </button>

  <div class="image-container">
    <img
      #lightboxImage
      [src]="currentPhoto"
      [alt]="'Photo ' + (currentIndex + 1) + ' of ' + totalPhotos"
      [style.transform]="'scale(' + imageScale + ')'"
    />
  </div>

  <button
    class="nav-button next"
    (click)="nextPhoto()"
    [disabled]="totalPhotos <= 1"
    title="Next photo"
  >
    ›
  </button>

  <div class="counter" *ngIf="totalPhotos > 1">
    {{ currentIndex + 1 }} / {{ totalPhotos }}
  </div>
</div>
